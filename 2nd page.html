<!DOCTYPE html>
<html>
<head>
    <title>Birthday Wishes</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="page">
        <h1>My Pookie ❤️</h1>

        <p id="typing"></p>

        <a href="3rd page.html" class="btn">Next 🌹</a>
    </div>

    <script>
        const text = `To my special one, you make my day brighter with your smile,
kindness, and love. Having you in my life is a blessing,
and I cherish every moment we share.
You will always hold a special place in my heart. ❤️`;

        let i = 0;

        function typeWriter() {
            if (i < text.length) {
                document.getElementById("typing").innerHTML += text.charAt(i);
                i++;
                setTimeout(typeWriter, 50);
            }
        }

        window.onload = typeWriter;
    </script>
</body>
</html>
